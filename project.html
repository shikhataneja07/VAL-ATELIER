<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project · Val Atelier</title>
<meta name="description" content="A Val Atelier project: the brief, the material palette and the full set of photographs.">
<script>document.documentElement.classList.add('js');</script>
<link rel="preload" href="assets/fonts/newsreader-300-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/hanken-grotesk-300-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="build" content="2026-09-17j · home 50+ plain, portrait centred">
<link rel="stylesheet" href="assets/css/val.css">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#F2EEE7">
</head>
<body id="top">

<div class="curtain"><img class="curtain__mark" src="assets/brand/val-atelier-mark-light.webp" alt=""></div>

<header data-header></header>
<noscript><nav class="wrap" style="padding-top:100px"><a href="index.html">Home</a> · <a href="about.html">About</a> · <a href="projects.html">Projects</a> · <a href="press.html">Press</a> · <a href="contact.html">Contact</a></nav></noscript>

<main data-project></main>

<footer data-footer></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/projects.js"></script>
<script src="assets/js/press.js"></script>
<script>
window.PAGE = function(VAL){
  var host = document.querySelector("[data-project]");
  if (!host) return;

  var slug = new URLSearchParams(location.search).get("p");
  var p = slug ? VAL.find(slug) : null;

  /* an unknown or missing slug lands somewhere useful rather than blank */
  if (!p){
    document.title = "Project not found · Val Atelier";
    host.innerHTML =
      '<section class="mast"><div class="wrap">' +
        '<div class="crumb rv-l"><i class="bar"></i><span class="label">Archive</span></div>' +
        '<h1 class="d2">That project isn&rsquo;t <em>here.</em></h1>' +
        '<p class="lede measure mt-l">The link may be out of date, or the project has not been published yet.</p>' +
        '<div class="mt-l rv"><a class="btn btn--solid" href="projects.html">Back to all projects <span class="ar">&rarr;</span></a></div>' +
      '</div></section>';
    return;
  }

  var siblings = VAL.byStatus(p.status);
  var at = siblings.indexOf(p);
  var prev = siblings[(at - 1 + siblings.length) % siblings.length];
  var next = siblings[(at + 1) % siblings.length];

  document.title = p.title + " · Val Atelier";
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", p.summary);

  var facts = [
    ["Typology", p.typology],
    ["Location", p.location],
    ["Area",     p.area],
    ["Year",     p.year]
  ].filter(function(f){ return f[1]; });

  /* The photographs run as a magazine spread: rows of mixed sizes, where a
     wide frame sits next to a narrow one, every picture keeps its own
     proportions, and each row is scaled so it fills the width exactly. That
     way the sizes vary but the gaps never do, and no row trails off with
     space left standing at the end of it. The widths are worked out in
     justify() below, once the page knows how wide it is. */
  var lead = VAL.cover(p);

  /* The set the project shows: the studio's own selection where it has made
     one, otherwise the supplied order, capped. The lead is already the first
     screen, so it is not repeated below it. */
  var cap = (window.SHOW || {})[p.status] || p.images.length;
  var chosen;
  if (p.select && p.select.length){
    chosen = p.select.map(function(n){ return n - 1; })
                     .filter(function(i){ return i >= 0 && i < p.images.length; });
  } else {
    chosen = p.images.map(function(_, i){ return i; });
  }
  var shots = chosen.filter(function(i){ return i !== lead; }).slice(0, cap);

  /* laid out as a sequence of beats rather than a grid of equals */
  var beats = VAL.sequence(shots.map(function(i){
    return { i: i, r: VAL.ratio(p, i) };
  }));

  var n = 0;
  var gallery = beats.map(function(beat, bi){
    var figs = beat.items.map(function(x){
      n++;
      var sizes = beat.k === "bleed" ? "100vw"
                : beat.k === "wide"   ? "92vw"
                : beat.k === "pair"   ? "(max-width:759px) 92vw, 44vw"
                : beat.k === "offset" ? "(max-width:759px) 92vw, 40vw"
                :                       "(max-width:759px) 92vw, 66vw";
      return '<figure class="seq__f" data-shot="' + x.i + '" style="--r:' + x.r.toFixed(5) + '">' +
               '<div class="shot' + (beat.k === "bleed" ? " wipe" : "") + '">' +
                 VAL.imgTag(p, x.i, p.title + ", photograph " + (n + 1), bi < 1, sizes) +
               '</div>' +
             '</figure>';
    }).join("");
    return '<div class="seq__b seq__b--' + beat.k + ' rv" data-d="' + (bi % 3) + '">' + figs + '</div>';
  }).join("");

  var backHref = "projects.html#" + p.status;

  host.innerHTML =
    /* the lead photograph, whole — its own proportions, title underneath */
    '<section class="mast" style="padding-bottom:0"><div class="wrap wrap--wide">' +
      '<a class="pj-back" href="' + backHref + '"><span class="ar">&larr;</span> ' +
        (p.status === "finished" ? "Selected work" : "Ongoing work") + '</a>' +
      '<figure class="pj-lead wipe mt-l" style="--ar:' + VAL.ratio(p, lead).toFixed(4) + '">' +
        VAL.imgTag(p, lead, p.title, true, "(max-width: 760px) 94vw, 60vw") + '</figure>' +
      '<div class="pj-head">' +
        '<div>' +
          '<span class="label rv-l">' + VAL.esc(p.category) + '</span>' +
          '<h1 data-lines>' + VAL.esc(p.title) + '</h1>' +
          /* typology, place, size and year: the four a client uses to judge
             whether the studio works at their scale. Quiet on purpose. */
          (function(){
            var line = [p.typology, p.location, p.area, p.year].filter(Boolean).join("  \u00b7  ");
            return line ? '<p class="pj-line rv-l" data-d="1">' + VAL.esc(line) + '</p>' : "";
          })() +
        '</div>' +
        '<p class="body rv" data-d="1">' +
          (p.status === "finished" ? "Completed" : "Ongoing") + '</p>' +
      '</div>' +
    '</div></section>' +

    '<section class="sec--tight"><div class="wrap wrap--wide"><div class="pj-facts rv">' +
      facts.map(function(f){
        return '<div><span class="k">' + VAL.esc(f[0]) + '</span><span class="v">' + VAL.esc(f[1]) + '</span></div>';
      }).join("") +
    '</div></div>' +

    /* Where the work has been published, say so on the project itself and
       link each one to the article. Nothing is rendered for a project with
       no coverage. */
    (function(){
      var features = (window.PRESS || []).filter(function(e){
        // a piece can cover more than one project, so projectSlug takes a list too
        var on = e.projectSlug;
        return Array.isArray(on) ? on.indexOf(p.slug) > -1 : on === p.slug;
      });
      if (!features.length) return "";
      return '<section class="sec--tight pj-feat"><div class="wrap wrap--wide">' +
        '<span class="label rv-l">Featured in</span>' +
        '<ul class="feat rv" data-d="1">' +
          features.map(function(e){
            return '<li><a href="' + VAL.esc(e.url) + '" target="_blank" rel="noopener">' +
                     '<span class="feat__o">' + VAL.esc(e.outlet) + '</span>' +
                     (e.title ? '<span class="feat__t">' + VAL.esc(e.title) + '</span>' : "") +
                     '<span class="ar">&rarr;</span>' +
                   '</a></li>';
          }).join("") +
        '</ul></div></section>';
    })() +

    /* the written copy is optional — a project with none simply goes
       straight from its facts to its photographs */
    ((p.summary || (p.story && p.story.length))
      ? '<section class="sec"><div class="wrap wrap--wide">' +
          /* the label used to sit inside the left column, which pushed the
             line under it down while the paragraphs opposite started at the
             top: the two never read as level. It is an eyebrow for the whole
             block now, so the two columns centre against each other. */
          '<span class="label rv-l">The brief</span>' +
          '<div class="pj-story mt-l">' +
            '<div>' +
              (p.summary ? '<p class="pull rv" data-d="1">' + VAL.esc(p.summary) + '</p>' : "") +
            '</div>' +
            '<div class="rv" data-d="2">' +
              (p.story || []).map(function(t){ return '<p class="body">' + VAL.esc(t) + '</p>'; }).join("") +
              (p.notes && p.notes.length
                ? '<div class="chips">' + p.notes.map(function(n){ return '<span>' + VAL.esc(n) + '</span>'; }).join("") + '</div>'
                : "") +
            '</div>' +
          '</div>' +
        '</div></section>'
      : '<div class="wrap wrap--wide" style="padding-top:clamp(40px,6vh,72px)"></div>') +

    '<section class="sec" style="padding-top:0"><div class="wrap wrap--wide">' +
      '<div class="head__top rv-l"><i class="bar" style="flex:0 0 44px;height:1px;background:var(--brass)"></i>' +
        '<span class="label">Photographs</span></div>' +
      '<div class="seq" data-gal>' + gallery + '</div>' +
    '</div></section>' +


    '<nav class="pj-next" aria-label="More projects">' +
      '<a class="prev rv-l" href="project.html?p=' + VAL.esc(prev.slug) + '">' +
        '<span class="label">Previous</span><span class="t">' + VAL.esc(prev.title) + '</span></a>' +
      '<a class="next rv-r" href="project.html?p=' + VAL.esc(next.slug) + '">' +
        '<span class="label">Next</span><span class="t">' + VAL.esc(next.title) + '</span></a>' +
    '</nav>' +

    '<section class="cta">' +
      '<div class="wrap"><span class="label rv">Enquiries</span>' +
        '<h2 data-lines>Something like <em>this?</em></h2>' +
        '<div class="cta__row rv" data-d="2">' +
          '<a class="btn btn--solid" href="contact.html">Start an enquiry <span class="ar">&rarr;</span></a>' +
          '<a class="btn" href="' + backHref + '">Back to the archive</a>' +
        '</div>' +
      '</div>' +
    '</section>';

  /* The sequence needs no measuring pass: each beat is sized in the
     stylesheet and each figure carries its own ratio, so the layout is
     right on the first paint and at every width without JavaScript. */

  VAL.splitLines(host);
  window.dispatchEvent(new Event("scroll"));

  /* full-frame viewer over every photograph in the project */
  var shots = p.images.map(function(im, i){
    return { src: p.dir + "/" + im[0], alt: p.title + ", photograph " + (i + 1) };
  });
  var open = VAL.lightbox(shots);
  VAL.qsa("[data-shot]", host).forEach(function(fig){
    fig.addEventListener("click", function(){ open(parseInt(fig.dataset.shot, 10)); });
  });
  var heroImg = VAL.qs(".pj-lead img", host);
  if (heroImg){ heroImg.style.cursor = "zoom-in"; heroImg.addEventListener("click", function(){ open(lead); }); }
};
</script>
<script src="assets/js/val.js"></script>
</body>
</html>
