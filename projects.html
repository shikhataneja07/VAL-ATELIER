<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Val Atelier</title>
<meta name="description" content="The Val Atelier project archive — ongoing interiors across homes, retail and hospitality, and the finished-work archive in preparation.">
<script>document.documentElement.classList.add('js');</script>
<link rel="preload" href="assets/fonts/newsreader-300-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/hanken-grotesk-300-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/val.css">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#F2EEE7">
</head>
<body id="top">

<div class="curtain"><img class="curtain__mark" src="assets/brand/val-atelier-mark-light.png" alt=""></div>

<header data-header></header>
<noscript><nav class="wrap" style="padding-top:100px"><a href="index.html">Home</a> · <a href="about.html">About</a> · <a href="projects.html">Projects</a> · <a href="pages.html">Pages</a> · <a href="contact.html">Contact</a></nav></noscript>

<main>

  <section class="mast">
    <div class="wrap">
      <div class="crumb"><i class="bar"></i><span class="label">Archive</span></div>
      <div class="mast__grid">
        <h1 data-lines>Projects</h1>
        <p class="lede rv-r" data-d="2">Homes, club houses, marketing suites, offices and jewellery retail. Open a project to see the full set of photographs.</p>
      </div>
    </div>
  </section>

  <section class="sec--tight" style="padding-top:0">
    <div class="wrap">
      <div class="tabs" role="tablist" aria-label="Project categories">
        <button role="tab" id="tab-ongoing" aria-controls="panel-ongoing" aria-selected="true" class="is-on" data-tab="ongoing">
          Ongoing projects <span class="c" data-count="ongoing"></span>
        </button>
        <button role="tab" id="tab-finished" aria-controls="panel-finished" aria-selected="false" data-tab="finished">
          Finished projects <span class="c" data-count="finished"></span>
        </button>
      </div>

      <!-- ONGOING ---------------------------------------------------- -->
      <div class="panel is-on" id="panel-ongoing" role="tabpanel" aria-labelledby="tab-ongoing" data-panel="ongoing">
        <div class="filters" data-filters="ongoing"></div>
        <div class="grid-work mgrid" data-grid="ongoing"></div>
        <div data-empty="ongoing"></div>

        <div class="mt-xl" data-index-wrap="ongoing">
          <div class="head__top"><i class="bar" style="flex:0 0 44px;height:1px;background:var(--brass)"></i><span class="label">Index</span></div>
          <ol class="index-list" data-index="ongoing"></ol>
        </div>
      </div>

      <!-- FINISHED --------------------------------------------------- -->
      <div class="panel" id="panel-finished" role="tabpanel" aria-labelledby="tab-finished" data-panel="finished" hidden>
        <div class="filters" data-filters="finished"></div>
        <div class="grid-work mgrid" data-grid="finished"></div>

        <div data-empty="finished"></div>
      </div>
    </div>
  </section>

  <section class="cta band-putty">
    <div class="wrap">
      <span class="label rv-l">Enquiries</span>
      <h2 class="rv" data-d="1">Have a space <em>in mind?</em></h2>
      <div class="cta__row rv" data-d="2">
        <a class="btn btn--solid" href="contact.html">Start an enquiry <span class="ar">&rarr;</span></a>
        <a class="btn" href="about.html">About the studio</a>
      </div>
    </div>
  </section>

</main>

<footer data-footer></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/projects.js"></script>
<script src="assets/js/categories.js"></script>
<script>
window.PAGE = function(VAL){

  function card(p, i){
    var meta = [p.typology, p.location].filter(Boolean).join(" · ") || p.scope;
    return '<a class="card plate hov rv" data-d="' + (i % 3) + '" href="project.html?p=' + VAL.esc(p.slug) + '">' +
             '<div class="shot wipe">' +
               VAL.imgTag(p, VAL.cover(p), p.title, false, "(max-width: 720px) 92vw, 44vw") +
               '<span class="card__n">' + VAL.pad(i + 1) + '</span>' +
             '</div>' +
             '<figcaption>' +
               '<span class="ttl">' + VAL.esc(p.title) + '<span class="sub">' + VAL.esc(meta) + '</span></span>' +
               '<span class="meta">' + VAL.esc(p.area || VAL.pad(p.images.length) + " photographs") + '</span>' +
             '</figcaption>' +
             '<span class="card__go">View project <span class="ar">&rarr;</span></span>' +
           '</a>';
  }

  function row(p, i){
    var meta = [p.typology, p.location, p.area].filter(Boolean).join(" · ");
    return '<li class="rv" data-d="' + Math.min(i, 3) + '">' +
             '<a href="project.html?p=' + VAL.esc(p.slug) + '" data-peek="' + VAL.esc(VAL.src(p, 0)) + '">' +
               '<span class="n">' + VAL.pad(i + 1) + '</span>' +
               '<span class="t">' + VAL.esc(p.title) + '</span>' +
               '<span class="m">' + VAL.esc(meta) + '</span>' +
               '<span class="ar">&rarr;</span>' +
             '</a></li>';
  }

  /* copy for a category that is designed and waiting rather than populated */
  var HOLD = {
    ongoing: {
      head: 'Work currently <em>on the boards.</em>',
      body: [
        "Projects still on site are published here once the studio and the client are happy for them to be shown. Rather than fill the page with stand-ins, it stays empty until there is something real to put in it.",
        "This section is already built. Each project will arrive with the same story, material notes and full photo set as the completed work."
      ],
      other: "finished",
      otherLabel: "See the finished work"
    },
    finished: {
      head: 'The completed archive is <em>being prepared.</em>',
      body: [
        "Handover photography for the studio's completed interiors is still being shot and catalogued.",
        "This section is already built. Each finished project will arrive with the same story, material notes and full photo set as the rest of the work."
      ],
      other: "ongoing",
      otherLabel: "See the ongoing work"
    }
  };

  function holding(status){
    var h = HOLD[status];
    return '<div class="empty">' +
             '<div class="empty__top">' +
               '<div><span class="label">' + (status === "ongoing" ? "Ongoing projects" : "Finished projects") + '</span>' +
                 '<h2 class="d3 rv-l" style="margin:20px 0 0">' + h.head + '</h2></div>' +
               '<div class="stack-sm">' + h.body.map(function(t){ return '<p class="body">' + VAL.esc(t) + '</p>'; }).join("") + '</div>' +
             '</div>' +
             '<div class="empty__frames" aria-hidden="true">' +
               '<div class="empty__frame"><span>Reserved</span></div>'.repeat(4) +
             '</div>' +
             '<div class="empty__note">' +
               '<span class="label">In the meantime</span>' +
               '<a class="alink" href="#" data-goto="' + h.other + '">' + h.otherLabel + ' <span class="ar">&rarr;</span></a>' +
               '<a class="alink" href="contact.html">Ask about a project <span class="ar">&rarr;</span></a>' +
             '</div>' +
           '</div>';
  }

  var populated = null;
  var filterState = { ongoing: "All", finished: "All" };

  function render(status){
    var set = VAL.byStatus(status);
    var pick = filterState[status];
    var shown = pick === "All" ? set : set.filter(function(p){ return p.category === pick; });

    var grid = document.querySelector('[data-grid="' + status + '"]');
    if (grid){ grid.innerHTML = shown.map(card).join(""); VAL.watch(grid); }

    var list = document.querySelector('[data-index="' + status + '"]');
    if (list){ list.innerHTML = shown.map(row).join(""); VAL.watch(list); }

    var counter = document.querySelector('[data-count="' + status + '"]');
    if (counter) counter.textContent = VAL.pad(set.length);

    document.querySelectorAll('[data-filters="' + status + '"] button').forEach(function(b){
      b.classList.toggle("is-on", b.dataset.cat === pick);
    });
  }

  function buildFilters(status){
    var host = document.querySelector('[data-filters="' + status + '"]');
    if (!host) return;
    var set = VAL.byStatus(status);
    if (!set.length){ host.remove(); return; }
    var cats = VAL.categories(status);
    /* one chip per category that genuinely exists in this status, nothing invented */
    host.innerHTML = '<button data-cat="All">All <span class="c">' + VAL.pad(set.length) + '</span></button>' +
      cats.map(function(c){
        return '<button data-cat="' + VAL.esc(c.name) + '">' + VAL.esc(c.name) +
               ' <span class="c">' + VAL.pad(c.count) + '</span></button>';
      }).join("");
    host.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        filterState[status] = b.dataset.cat;
        render(status);
        if (history.replaceState){
          var q = "?tab=" + status + (b.dataset.cat === "All" ? "" : "&cat=" + encodeURIComponent(b.dataset.cat));
          history.replaceState(null, "", q);
        }
      });
    });
  }

  ["ongoing", "finished"].forEach(function(status){
    var set = VAL.byStatus(status);
    if (set.length && !populated) populated = status;
    buildFilters(status);
    render(status);

    var wrap = document.querySelector('[data-index-wrap="' + status + '"]');
    if (wrap && !set.length) wrap.remove();

    var empty = document.querySelector('[data-empty="' + status + '"]');
    if (empty) empty.outerHTML = set.length ? "" : holding(status);
  });

  /* category switch */
  var tabs = VAL.qsa("[data-tab]");
  function select(name){
    tabs.forEach(function(t){
      var on = t.dataset.tab === name;
      t.classList.toggle("is-on", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    VAL.qsa("[data-panel]").forEach(function(pane){
      var on = pane.dataset.panel === name;
      pane.classList.toggle("is-on", on);
      if (on) pane.removeAttribute("hidden"); else pane.setAttribute("hidden", "");
    });
    VAL.watch(document.querySelector('[data-panel="' + name + '"]'));
    if (history.replaceState){
      var cat = filterState[name];
      history.replaceState(null, "", "?tab=" + name + (cat && cat !== "All" ? "&cat=" + encodeURIComponent(cat) : ""));
    }
  }
  tabs.forEach(function(t){ t.addEventListener("click", function(){ select(t.dataset.tab); }); });
  VAL.qsa("[data-goto]").forEach(function(a){
    a.addEventListener("click", function(e){ e.preventDefault(); select(a.dataset.goto); });
  });
  var q = new URLSearchParams(location.search);
  var wantTab = q.get("tab") || (location.hash ? location.hash.slice(1) : "");
  var wantCat = q.get("cat");
  if (wantCat && wantTab && filterState[wantTab] !== undefined){
    var valid = VAL.categories(wantTab).some(function(c){ return c.name === wantCat; });
    if (valid){ filterState[wantTab] = wantCat; render(wantTab); }
  }
  if (wantTab === "finished" || wantTab === "ongoing") select(wantTab);
  else if (populated) select(populated);
};
</script>
<script src="assets/js/val.js"></script>
</body>
</html>
